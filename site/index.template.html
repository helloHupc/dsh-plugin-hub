<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{{SEO_META}}
<link rel="icon" href="favicon.png">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('dsh-theme')||'dark'}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="topbar-top">
      <h1><span class="logo-wrap"><img class="logo" src="logo.png" alt="DeepSeek"></span> DSH 插件聚合站</h1>
      <div class="actions">
        <button id="theme-btn" type="button" title="切换浅色/深色外观">🌙</button>
        <a class="github" href="https://github.com/helloHupc/dsh-plugin-hub" target="_blank" rel="noopener" title="GitHub 仓库">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
          <span>GitHub</span>
        </a>
      </div>
    </div>
    <p class="sub">全网 DeepSeek Harness 插件 · 多源聚合 · 自动分类 · 每小时刷新</p>
    <div class="stats" id="stats">
      <span class="stat">插件总数 <b id="stat-total">–</b></span>
      <span class="stat">数据来源 <b id="stat-sources">–</b></span>
      <span class="stat">最后刷新 <b id="stat-updated">–</b></span>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="toolbar">
    <input id="search" type="search" placeholder="搜索插件名 / 描述 / 标签(如: memory, tts, mcp…)" autocomplete="off">
    <select id="sort">
      <option value="stars">按 Star 排序</option>
      <option value="pushed">按最近更新</option>
      <option value="name">按名称</option>
    </select>
    <select id="size">
      <option value="24">24 条/页</option>
      <option value="48" selected>48 条/页</option>
      <option value="96">96 条/页</option>
    </select>
  </section>

  <section class="cats" id="cats"></section>

  <div class="resultbar">
    <span id="result-count"></span>
  </div>

  <section class="grid" id="grid">{{STATIC_CARDS}}</section>

  <nav class="pager" id="pager"></nav>
</main>

<footer class="wrap foot">
  <span>聚合源:</span><span id="foot-sources"></span>
  <p class="warn">⚠️ 安装第三方插件即在本机以你的权限执行第三方代码,安装前请自行审阅源码。</p>
</footer>

<script src="app.js"></script>
<script>addEventListener("load",()=>{try{navigator.sendBeacon("/api/t?p="+encodeURIComponent(location.pathname))}catch(e){}});</script>
</body>
</html>
