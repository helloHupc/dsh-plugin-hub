<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSH 插件聚合站 · DeepSeek Harness 插件检索</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <h1><img class="logo" src="logo.png" alt="DeepSeek"> DSH 插件聚合站</h1>
    <p class="sub">全网 DeepSeek Harness 插件 · 多源聚合 · 自动分类 · 每小时刷新</p>
    <div class="stats" id="stats">
      <span class="stat">插件总数 <b id="stat-total">–</b></span>
      <span class="stat">数据来源 <b id="stat-sources">–</b></span>
      <span class="stat">最后刷新 <b id="stat-updated">–</b></span>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="toolbar">
    <input id="search" type="search" placeholder="搜索插件名 / 描述 / 标签(如: memory, tts, mcp…)" autocomplete="off">
    <select id="sort">
      <option value="stars">按 Star 排序</option>
      <option value="pushed">按最近更新</option>
      <option value="name">按名称</option>
    </select>
    <select id="size">
      <option value="24">24 条/页</option>
      <option value="48" selected>48 条/页</option>
      <option value="96">96 条/页</option>
    </select>
  </section>

  <section class="cats" id="cats"></section>

  <div class="resultbar">
    <span id="result-count"></span>
  </div>

  <section class="grid" id="grid"></section>

  <nav class="pager" id="pager"></nav>
</main>

<footer class="wrap foot">
  <span>聚合源:</span><span id="foot-sources"></span>
  <p class="warn">⚠️ 安装第三方插件即在本机以你的权限执行第三方代码,安装前请自行审阅源码。</p>
</footer>

<script src="app.js"></script>
</body>
</html>
