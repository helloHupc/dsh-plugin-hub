name: refresh-data

on:
  schedule:
    - cron: "0 * * * *"        # 每小时整点
  workflow_dispatch: {}        # 手动触发

permissions:
  contents: write              # 允许提交更新的 data/plugins.json

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ETL (aggregate)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/aggregate.py

      - name: Build static SEO site
        run: python3 scripts/build_site.py

      - name: Show stats
        run: python3 -c "import json;d=json.load(open('data/plugins.json'));print('total',d['meta']['total'],'uncat',d['meta']['stats']['uncategorized'])"

      - name: Commit & push if changed
        run: |
          git config user.name "dsh-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/plugins.json data/raw/ site/index.html site/robots.txt site/sitemap.xml
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(data): hourly refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Compute deploy gate (deploy every 2h on schedule, always on manual)
        id: gate
        run: |
          HOUR=$(date -u +%H)
          H=$((10#$HOUR % 2))
          if [ "$H" -eq 0 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to EdgeOne Makers
        if: steps.gate.outputs.deploy == 'true' && env.EDGEONE_PAGES_API_TOKEN != ''
        env:
          EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
        run: |
          npm install -g edgeone@latest
          edgeone makers deploy -n dsh-plugin-hub -e production
